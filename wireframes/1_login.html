<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe 1 - Login & Authentication | RiwiMediCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
    <!-- Header Banner -->
    <div class="bg-gradient-to-tr from-indigo-950 via-indigo-900 to-slate-900 p-8 text-center text-white relative">
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-cyan-400/20 backdrop-blur-md flex items-center justify-center border border-cyan-400/30 shadow-inner">
        <i class="fa-solid fa-notes-medical text-3xl text-cyan-300"></i>
      </div>
      <h1 class="text-2xl font-black tracking-tight">Riwi<span class="text-cyan-400">MediCare</span></h1>
      <p class="text-indigo-200 text-xs mt-1">Authentication & Access Control Module</p>
    </div>

    <!-- Login Body -->
    <div class="p-8">
      <div class="mb-5 bg-indigo-50 border border-indigo-100 rounded-xl p-3.5 text-xs text-indigo-900 flex items-start space-x-3">
        <i class="fa-solid fa-lock text-indigo-600 mt-0.5 text-sm"></i>
        <div>
          <strong class="font-bold">Protected Access:</strong> Sign in with your assigned account (System Administrator or Clinical Manager).
        </div>
      </div>

      <form action="#" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="email" placeholder="user@riwimedicare.com" value="admin@riwimedicare.com" class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" required />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
            <a href="#" class="text-xs text-indigo-600 font-semibold hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="fa-solid fa-key"></i>
            </span>
            <input type="password" value="••••••••••••" class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition" required />
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center text-xs text-slate-600 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" />
            <span class="ml-2 font-medium">Remember session</span>
          </label>
          <span class="text-xs font-semibold text-slate-400">JWT Token Security</span>
        </div>

        <button type="button" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition duration-200">
          <span>Sign In to Platform</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <div class="mt-6 text-center border-t border-slate-100 pt-4 text-xs text-slate-500">
        <p>RiwiMediCare System • Standard 220501096</p>
      </div>
    </div>
  </div>

</body>
</html>
